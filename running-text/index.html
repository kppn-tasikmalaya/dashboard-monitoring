<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Running Text Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* Container utama */
.ticker-wrapper{
    height:70px;
    width:100%;
    background:#0B2E59;
    border-top:3px solid #D4AF37;
    border-bottom:3px solid #D4AF37;

    display:flex;
    align-items:center;
}

/* Area logo */
.logo-section{
    width:200px;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    background:#082447;

    flex-shrink:0;
}

.logo-section img{
    height:90%;
}

.logo-text{
    color:white;
    font-size:15px;
    line-height:1.2;
    font-weight:600;
}

/* Label informasi */
.info-label{
    height:100%;
    padding:0 20px;

    background:#D4AF37;
    color:#0B2E59;

    display:flex;
    align-items:center;

    font-weight:700;
    font-size:13px;
    letter-spacing:1px;

    flex-shrink:0;
}

/* Area ticker */
.ticker{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
}

.ticker-content{
    display:inline-block;
    padding-left:100%;
    color:white;
    font-size:15px;
    font-weight:500;

    animation: ticker 10s linear infinite;
}

@keyframes ticker{
    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-100%);
    }
}

.separator{
    color:#D4AF37;
    margin:0 20px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="ticker-wrapper">

    <!-- Logo -->
    <div class="logo-section">

        <img src="Logo_DJPB.png" alt="Logo">

        <div class="logo-text">
            KPPN<br>
            TASIKMALAYA
        </div>

    </div>

    <!-- Label -->
    <div class="info-label">
        INFORMASI TERKINI
    </div>

    <!-- Running Text -->
    <div class="ticker">

        <div class="ticker-content" id="runningText">

            Loading...

        </div>

    </div>

</div>
    
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzkZ02smhSk3e_RJOnYjDh6cIU3_F89fdjACf9D8QVeLurx2cc-339tj81Z3YFZO6EM/exec";
const ticker = document.getElementById("runningText");
const speed = 50; // Atur kecepatan di sini (piksel per detik)

// Fungsi untuk menghitung dan menerapkan durasi animasi
function updateTickerSpeed() {
    const distance = ticker.scrollWidth;
    const duration = distance / speed;
    ticker.style.animationDuration = duration + "s";
}

// 1. Langsung hitung kecepatan untuk teks "Loading..." saat halaman pertama dimuat
updateTickerSpeed();

async function loadTicker() {
    try {
        const response = await fetch(API_URL);
        const data = await response.json();
        const text = data.join('<span class="separator">●</span>');
        
        // 2. Hentikan animasi sejenak. Ini penting agar saat data baru masuk, 
        // teks tidak melompat, melainkan mulai masuk dengan rapi dari ujung kanan layar.
        ticker.style.animation = 'none';
        
        // Memaksa browser mereset animasi (Force Reflow)
        ticker.offsetHeight; 

        // 3. Masukkan teks baru dari spreadsheet
        ticker.innerHTML = text;

        // 4. Nyalakan lagi animasinya
        ticker.style.animation = 'ticker linear infinite';

        // 5. Hitung ulang kecepatan sesuai panjang teks baru yang lebih panjang
        // (Diberi jeda 50ms agar browser selesai merender teks baru sebelum diukur)
        setTimeout(() => {
            updateTickerSpeed();
        }, 50);

    } catch (error) {
        // Lakukan hal yang sama jika terjadi error / internet mati
        ticker.style.animation = 'none';
        ticker.offsetHeight;
        ticker.innerHTML = "Gagal memuat data / Data tidak tersedia";
        ticker.style.animation = 'ticker linear infinite';
        
        setTimeout(() => {
            updateTickerSpeed();
        }, 50);
    }
}

loadTicker();
</script>
    
</body>
</html>
